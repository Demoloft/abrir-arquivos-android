<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abrir arquivos</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;background:#f5f5f5}
main{width:min(92%,420px);padding:32px 24px;text-align:center;background:#fff;border-radius:20px;box-shadow:0 8px 30px #0001}
h1{margin:0 0 22px;font-size:24px}
button{border:0;border-radius:14px;padding:16px 28px;font-size:18px;font-weight:600;cursor:pointer;background:#1976d2;color:#fff}
p{color:#666;font-size:14px;margin-top:18px}
input{display:none}
</style>
</head>
<body>
<main>
<h1>📁 Meus arquivos</h1>
<input id="files" type="file" multiple>
<button type="button" onclick="document.getElementById('files').click()">Abrir arquivos</button>
<p>Toque no botão para abrir o seletor de arquivos do Android.</p>
</main>
</body>
</html>
