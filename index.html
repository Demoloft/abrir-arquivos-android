<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abrir arquivos</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5;
  }
  main {
    width: min(92%, 420px); padding: 32px 24px; text-align: center;
    background: white; border-radius: 20px; box-shadow: 0 8px 30px #0001;
  }
  h1 { margin: 0 0 22px; font-size: 24px; }
  button {
    border: 0; border-radius: 14px; padding: 16px 28px;
    font-size: 18px; font-weight: 600; cursor: pointer;
    background: #1976d2; color: white;
  }
  button:active { transform: scale(.98); }
  p { color: #666; font-size: 14px; margin: 18px 0 0; }
</style>
</head>
<body>
<main>
  <h1>📁 Meus arquivos</h1>
  <button id="open">Abrir arquivos</button>
  <p>Toque no botão para escolher um arquivo no Android.</p>
</main>
<script>
document.getElementById('open').addEventListener('click', () => {
  // Tenta abrir o seletor de documentos do Android.
  window.location.href = 'intent:#Intent;action=android.intent.action.OPEN_DOCUMENT;type=*/*;end';
});
</script>
</body>
</html>
